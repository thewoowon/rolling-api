services:
  postgres:
    image: postgres:16
    container_name: rolling-postgres
    environment:
      POSTGRES_USER: rolling
      POSTGRES_PASSWORD: rolling
      POSTGRES_DB: rolling
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rolling -d rolling"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: rolling-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://rolling:rolling@postgres:5432/rolling
      DATABASE_URL_ASYNC: postgresql+asyncpg://rolling:rolling@postgres:5432/rolling
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
    command: ["poetry", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  postgres_data:
